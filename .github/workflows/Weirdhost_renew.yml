name: Weirdhost 多账号自动续期

on:
  schedule:
    - cron: '20 4 * * *'
  workflow_dispatch:

jobs:
  add_time:
    name: 续期脚本
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      actions: write

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb x11-utils fonts-nanum fonts-noto-cjk xdotool scrot

      - name: 安装 Python 依赖
        run: |
          python -m pip install --upgrade pip
          pip install seleniumbase aiohttp pynacl

      - name: 启动 sing-box 代理（可选，配置了 PROXY_URL 才生效）
        env:
          PROXY_URL: ${{ secrets.PROXY_URL }}
        run: |
          if [ -z "$PROXY_URL" ]; then
            echo "未设置 PROXY_URL，跳过代理配置，直连运行。"
            exit 0
          fi
          SINGBOX_VER="1.13.16"
          echo "下载 sing-box v${SINGBOX_VER}..."
          wget -q "https://github.com/SagerNet/sing-box/releases/download/v${SINGBOX_VER}/sing-box-${SINGBOX_VER}-linux-amd64.tar.gz"
          tar -xzf "sing-box-${SINGBOX_VER}-linux-amd64.tar.gz"
          mv "sing-box-${SINGBOX_VER}-linux-amd64/sing-box" ./sing-box
          chmod +x ./sing-box
          echo "生成 sing-box 配置..."
          python proxy_handler.py
          echo "启动 sing-box..."
          nohup ./sing-box run -c config.json > singbox.log 2>&1 &
          sleep 24
          echo "--- singbox.log ---"
          cat singbox.log || true
          if ! pgrep -f "./sing-box" > /dev/null; then
            echo "❌ sing-box 进程未运行"
            exit 1
          fi
          echo "--- 代理连通性测试 ---"
          if ! curl -s -m 30 -x http://127.0.0.1:8080 https://api.ip.sb/ip; then
            echo ""
            echo "❌ 代理连接失败，请检查 PROXY_URL"
            exit 1
          fi
          echo ""
          echo "✅ 代理可用"

      - name: 运行续期脚本
        env:
          WEIRDHOST_COOKIE_1: ${{ secrets.WEIRDHOST_COOKIE_1 }}
          WEIRDHOST_COOKIE_2: ${{ secrets.WEIRDHOST_COOKIE_2 }}
          WEIRDHOST_COOKIE_3: ${{ secrets.WEIRDHOST_COOKIE_3 }}
          WEIRDHOST_COOKIE_4: ${{ secrets.WEIRDHOST_COOKIE_4 }}
          WEIRDHOST_COOKIE_5: ${{ secrets.WEIRDHOST_COOKIE_5 }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          REPO_TOKEN: ${{ secrets.REPO_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PROXY_URL: ${{ secrets.PROXY_URL }}
          PROXY_SERVER: http://127.0.0.1:8080
          IS_PROXY: ${{ secrets.PROXY_URL != '' && 'true' || 'false' }}
          NODE_ATTEMPTS: '3'
        run: |
          xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" python scripts/weirdhost_renew.py

      - name: 上传调试截图
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-screenshots
          path: |
            *.png
            singbox.log
            config.json
          retention-days: 3
          if-no-files-found: ignore

      - name: 清理旧的工作流运行记录
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ github.token }}
          repository: ${{ github.repository }}
          delete_workflow_pattern: ${{ github.workflow }}
          retain_days: 0
          keep_minimum_runs: 3
